name: Branch macOS DMG

on:
  workflow_dispatch:
    inputs:
      arch:
        description: macOS architecture
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: read

jobs:
  macos-dmg:
    name: macOS DMG (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-14' }}
    env:
      TARGET: ${{ inputs.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --target "$TARGET"

      - name: Build macOS DMG
        run: |
          VERSION="$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          BINARY_DIR="$PWD/target/$TARGET/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ inputs.arch }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexPlusPlus-${{ inputs.arch }}-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
